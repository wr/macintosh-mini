version = 1
SPDX-PackageName = "macintosh-mini"
SPDX-PackageSupplier = "Wells Riley"
SPDX-PackageDownloadLocation = "https://github.com/wr/macintosh-mini"

# When several annotations match a file, the last one wins.

# Docs, drawings, photos and everything else.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Wells Riley"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Software.
[[annotations]]
path = ["setup.sh", "maclock-build/**", ".github/workflows/**", ".github/scripts/**", "disk-image/**/*.py", "disk-image/*.toml", "disk-image/requirements.txt", "docs/setup-guide/*.py", "docs/setup-guide/*.sh"]
SPDX-FileCopyrightText = "2026 Wells Riley"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Hardware: the boards, the bezel and the USB jig.
[[annotations]]
path = ["maclock-pcb/**", "maclock-interposer/**", "maclock-screen-bezel/**", "maclock-usb-jig/**"]
SPDX-FileCopyrightText = "2026 Wells Riley"
SPDX-License-Identifier = "CERN-OHL-S-2.0"

# Third-party files, not covered by this repository's licenses.
[[annotations]]
path = "emulators/chimes/*.wav"
SPDX-FileCopyrightText = "Apple Computer, Inc."
SPDX-License-Identifier = "LicenseRef-Third-Party"

# Big Maclock's licence, shipped on the disk image beside the app.
[[annotations]]
path = "disk-image/files/Big Maclock License.txt"
SPDX-FileCopyrightText = "2026 Retro-Theory"
SPDX-License-Identifier = "MIT"

# 3D models from LCSC's EasyEDA library, used only for renders.
[[annotations]]
path = "maclock-pcb/lcsc.3dshapes/**"
SPDX-FileCopyrightText = "LCSC Electronics"
SPDX-License-Identifier = "LicenseRef-Third-Party"

# Waveshare's waveshare-28dpi-3b-4b overlay with the touch and backlight
# fragments removed.
[[annotations]]
path = "maclock-build/waveshare-28dpi-3b-4b-notouch.dts"
SPDX-FileCopyrightText = "Waveshare"
SPDX-License-Identifier = "LicenseRef-Third-Party"

# App icons in the setup guide, copied from the apps on our Mac OS 8.1 disk.
[[annotations]]
path = "docs/setup-guide/icons/*.png"
SPDX-FileCopyrightText = "Each app's maker"
SPDX-License-Identifier = "LicenseRef-Third-Party"
