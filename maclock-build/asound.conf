# macintosh-mini: everything played on the default device passes through the
# audiogate plugin, which tells audio_gate.py when there's sound, so it can let
# go of the speaker's audio pin while there's none. See maclock-build/README.md.
pcm_type.audiogate {
	lib "/usr/local/lib/alsa-lib/libasound_module_pcm_audiogate.so"
}

pcm.!default {
	type plug
	slave.pcm {
		type audiogate
		slave.pcm "hw:Headphones"
	}
}
