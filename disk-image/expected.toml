# What check_image.py expects of the finished Mac OS 8.1 disk image.

volume_name = "Macintosh HD"
size = 1073741824   # 1 GiB

required = [
  "System Folder:System",
  "System Folder:Finder",
  "System Folder:Extensions:AppleTalk ImageWriter",
  "System Folder:Control Panels:After Dark 4.0",
  "System Folder:Control Panels:After Dark Files:Randomizers:Randomizer",
  "System Folder:Control Panels:After Dark Files:After Dark 2.0:Flying Toasters",
  "System Folder:Control Panels:After Dark Files:More After Dark:Mowin' Man",
  "Applications:SimpleText",
  "Internet:iCab:iCab",
  "Internet:Start Page",
  "Internet:MR Browser 68K v0.39",
  "Utilities:Disk Copy",
  "Utilities:StuffIt Expander™",
]

# Its chosen printer must be blank: each AirWriter has its own name, so the user picks it once.
printer_driver = "System Folder:Extensions:AppleTalk ImageWriter"

empty = ["Trash"]

# Display Preferences remembers the colour depth it was saved at and Mac OS restores it at every
# boot, which would override the depth Basilisk II is set to.
absent = [
  "System Folder:Preferences:Display Preferences",
  # The After Dark 4.0 module set: the image has the original modules instead.
  "System Folder:Control Panels:After Dark Files:After Dark 4.0",
  "System Folder:Control Panels:After Dark Files:Randomizers:All 4.0 Displays",
]

[[desktop]]
name = "iCab"
alias = true

[[desktop]]
name = "SimpleText"
alias = true

[[desktop]]
name = "MR Browser"
alias = true
